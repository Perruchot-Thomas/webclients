name: Deploy AstroJS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            echo "======================================"
            echo "Début du déploiement"
            echo "======================================"
            
            cd /var/www/webclients
            git pull origin main
            /home/etudiant/.bun/bin/bun install
            /home/etudiant/.bun/bin/bun run build
            
            sudo systemctl restart webclients
            sudo systemctl status webclients
            curl --fail http://localhost:3344/
            
            echo "======================================"
            echo "Déploiement terminé"
            echo "======================================"